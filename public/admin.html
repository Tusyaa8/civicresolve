<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n-page-title="admin.page_title">CivicResolve</title>

  <!-- Font support for all 12 languages -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&family=Noto+Sans+Gurmukhi:wght@400;600;700&family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&family=Noto+Sans+Oriya:wght@400;600;700&family=Noto+Sans+Tamil:wght@400;600;700&family=Noto+Sans+Telugu:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header / Navigation -->
  <header class="site-header">
    <div class="container">
      <div class="header-main-row">
        <!-- Brand Logo (Start) -->
        <a href="/" class="brand-link">
          <div class="brand-icon">CR</div>
          <div class="brand-text">
            <div class="brand-title" data-i18n="app_name"></div>
            <div class="brand-subtitle" data-i18n="app_tagline"></div>
          </div>
        </a>

        <!-- Desktop Navigation -->
        <nav class="desktop-nav" aria-label="Main Navigation">
          <ul class="nav-links">
            <li><a href="/" class="nav-link" data-i18n="nav.home"></a></li>
            <li><a href="/report" class="nav-link" data-i18n="nav.report"></a></li>
            <li><a href="/track" class="nav-link" data-i18n="nav.track"></a></li>
            <li><a href="/issues" class="nav-link" data-i18n="nav.issues"></a></li>
            <li><a href="/admin" class="nav-link active admin-link" data-i18n="nav.admin"></a></li>
          </ul>
        </nav>

        <!-- Actions (End: Hamburger Button + Fixed Compact Language Switcher) -->
        <div class="header-end-actions">
          <button type="button" class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation Menu" aria-expanded="false">
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
            <span class="hamburger-bar"></span>
          </button>
          <div class="lang-switcher-wrapper">
            <select class="lang-switcher-select" data-i18n-aria="nav.change_language" aria-label="Select Language"></select>
          </div>
        </div>
      </div>

      <!-- Collapsible Mobile Navigation Drawer -->
      <nav class="mobile-nav" id="mobileNav" aria-label="Mobile Navigation">
        <ul class="mobile-nav-links">
          <li><a href="/" class="nav-link" data-i18n="nav.home"></a></li>
          <li><a href="/report" class="nav-link" data-i18n="nav.report"></a></li>
          <li><a href="/track" class="nav-link" data-i18n="nav.track"></a></li>
          <li><a href="/issues" class="nav-link" data-i18n="nav.issues"></a></li>
          <li><a href="/admin" class="nav-link active admin-link" data-i18n="nav.admin"></a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="container">
      <div class="form-card" style="text-align: center; padding: 48px 24px;">
        <div style="font-size: 3rem; margin-bottom: 12px;">🛡️</div>
        <h1 class="page-title" data-i18n="admin.placeholder_title"></h1>
        <p class="page-subtitle" style="margin-bottom: 28px;" data-i18n="admin.placeholder_desc"></p>
        <a href="/" class="btn btn-primary" data-i18n="admin.btn_back_home"></a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p data-i18n="footer.about"></p>
      <p data-i18n="footer.built_with"></p>
    </div>
  </footer>

  <script src="/js/i18n.js"></script>
</body>
</html>
